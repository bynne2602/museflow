name: Package and publish extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build extension ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd()
          output = root / "dist" / "MuseFlow-extension.zip"
          included = [
              "app.html", "app.js", "background.js", "manifest.json",
              "muse-bridge.js", "styles.css", "VERSION.txt", "LICENSE",
              "THIRD_PARTY_NOTICES.md", "README.md", "README-vi.md",
          ]
          included.extend(str(path.relative_to(root)) for folder in ("docs/screenshots", "icons", "licenses", "vendor")
                          for path in (root / folder).rglob("*") if path.is_file())
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for name in sorted(included):
                  archive.write(root / name, Path("MuseFlow") / name)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/MuseFlow-extension.zip --title "MuseFlow $VERSION" --generate-notes --latest
